<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Team Performance</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1a1d23;--mute:#667085;--line:#e4e7ec;--accent:#2f6fed;--accent2:#e8590c;--up:#12805c;--down:#c4320a;--bar:#dbe6fd}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111317;--card:#1a1d23;--ink:#eceef2;--mute:#98a2b3;--line:#2c313a;--accent:#6c9cff;--accent2:#ff8a4c;--up:#3ccf91;--down:#ff7a59;--bar:#24324f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1150px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:22px;margin:0}
.sub{color:var(--mute);font-size:13px}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi .l{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:26px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
.d{font-size:12px;margin-top:2px}.d.up{color:var(--up)}.d.down{color:var(--down)}.d.flat{color:var(--mute)}
h2{font-size:15px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:600;font-size:12px;cursor:pointer;user-select:none}
tr:last-child td{border-bottom:0}
.barcell{position:relative}
.barcell span.b{position:absolute;left:0;top:6px;bottom:6px;background:var(--bar);border-radius:4px;z-index:0}
.barcell span.t{position:relative;z-index:1}
.row{display:grid;grid-template-columns:170px 1fr 60px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:6px}
.row .c{text-align:right;font-variant-numeric:tabular-nums}
.days{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mute)}
.day .col{width:100%;max-width:48px;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px}
.day .num{color:var(--ink);font-weight:600;margin-bottom:4px}
.note{color:var(--mute);font-size:12px;margin-top:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--bar);font-size:12px}
.warn{color:var(--accent2)}
</style>
</head>
<body>
<div class="wrap">
<header>

const SNAPSHOT_DATE = "23 Sep 2026";

function parseCSV(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=""}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);rows.push(r);r=[];f=""}else f+=c}if(f!==""||r.length){r.push(f);rows.push(r)}return rows}
const M={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function pDate(s){s=(s||"").trim();let m=s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[A-Za-z]*[-\/ ](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,M[m[2].toLowerCase()],+m[1])}m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return new Date(+m[3],+m[1]-1,+m[2]);const d=new Date(s);return isNaN(d)?null:d}
const num=s=>{const n=parseFloat(String(s||"").replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n};
const cleanName=s=>{s=(s||"").trim().replace(/\s+/g," ");return s?s.split(" ").map(w=>w[0].toUpperCase()+w.slice(1).toLowerCase()).join(" "):"Unassigned"};
const monday=d=>{const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);x.setHours(0,0,0,0);return x};
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmtD=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const fmt=n=>Math.round(n).toLocaleString("en-IN");
const pct=(a,b)=>b?(a/b*100).toFixed(1)+"%":"–";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let DATA=[],HEAD=[],sortKey="tasks",sortDir=-1;

function load(text,label){
  const rows=parseCSV(text).filter(r=>r.some(c=>c.trim()));
  HEAD=rows[0].map(h=>h.trim());
  const ix=n=>HEAD.findIndex(h=>h.toLowerCase().startsWith(n));
  const I={date:ix("date"),who:ix("work done"),type:ix("review type"),ent:ix("enterprise name"),roof:ix("rooftop name"),vins:HEAD.findIndex(h=>h.toLowerCase()=="vins"),imp:ix("impacted"),seg:ix("segment")};
  DATA=rows.slice(1).map(r=>{const d=pDate(r[I.date]);return d&&{raw:r,date:d,week:key(monday(d)),who:cleanName(r[I.who]),type:(r[I.type]||"").trim()||"Unspecified",ent:(r[I.ent]||"").trim()||"—",seg:(r[I.seg]||"").trim()||"Unspecified",vins:num(r[I.vins]),imp:num(r[I.imp])}}).filter(Boolean);
  document.getElementById("src").innerHTML=label+" · "+DATA.length+" entries";
  const weeks=[...new Set(DATA.map(r=>r.week))].sort().reverse();
  const sel=document.getElementById("wk"),prev=sel.value;
  sel.innerHTML=weeks.map(w=>{const s=new Date(w+"T00:00"),e=new Date(s);e.setDate(e.getDate()+6);return `<option value="${w}">${fmtD(s)} – ${fmtD(e)} ${s.getFullYear()}</option>`}).join("");
  if(weeks.includes(prev))sel.value=prev;
  render();
}

function agg(rows){return{tasks:rows.length,vins:rows.reduce((a,r)=>a+r.vins,0),imp:rows.reduce((a,r)=>a+r.imp,0),people:new Set(rows.map(r=>r.who)).size,ents:new Set(rows.map(r=>r.ent)).size}}
function delta(c,p){if(p==null)return'<div class="d flat">no prior week</div>';if(!p)return'<div class="d flat">prev 0</div>';const x=(c-p)/p*100;const cl=x>0.5?"up":x<-0.5?"down":"flat";return `<div class="d ${cl}">${x>0?"▲":x<0?"▼":"■"} ${Math.abs(x).toFixed(0)}% vs prev week</div>`}
function bars(el,map,valFn){const arr=[...map].sort((a,b)=>b[1]-a[1]).slice(0,10);const mx=Math.max(1,...arr.map(a=>a[1]));document.getElementById(el).innerHTML=arr.length?arr.map(([k,v])=>`<div class="row"><div class="n" title="${esc(k)}">${esc(k)}</div><div class="track"><div class="fill" style="width:${v/mx*100}%"></div></div><div class="c">${valFn?valFn(v):fmt(v)}</div></div>`).join(""):'<div class="note">No data</div>'}
function group(rows,f,v){const m=new Map();rows.forEach(r=>m.set(f(r),(m.get(f(r))||0)+(v?v(r):1)));return m}

function render(){
  const wk=document.getElementById("wk").value;if(!wk)return;
  const weeks=[...new Set(DATA.map(r=>r.week))].sort();
  const pw=weeks[weeks.indexOf(wk)-1];
  const cur=DATA.filter(r=>r.week==wk),prv=pw?DATA.filter(r=>r.week==pw):null;

  const s=new Date(wk+"T00:00"),e=new Date(s);e.setDate(e.getDate()+6);
  document.getElementById("wkLabel").textContent="· "+fmtD(s)+" – "+fmtD(e);
  document.getElementById("kpis").innerHTML=[
    ["Tasks completed",fmt(a.tasks),delta(a.tasks,b&&b.tasks)],
    ["VINs reviewed",fmt(a.vins),delta(a.vins,b&&b.vins)],
    ["Impacted VINs",fmt(a.imp),delta(a.imp,b&&b.imp)],
    ["Impact rate",pct(a.imp,a.vins),b?`<div class="d flat">prev ${pct(b.imp,b.vins)}</div>`:'<div class="d flat">no prior week</div>'],
    ["Active members",a.people,`<div class="d flat">${a.ents} enterprises covered</div>`]
  ].map(([l,v,d])=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div>${d}</div>`).join("");

  // people
  const P=new Map();
  cur.forEach(r=>{const p=P.get(r.who)||{who:r.who,tasks:0,vins:0,imp:0,days:new Set(),types:new Map()};p.tasks++;p.vins+=r.vins;p.imp+=r.imp;p.days.add(key(r.date));p.types.set(r.type,(p.types.get(r.type)||0)+1);P.set(r.who,p)});
  const prevT=prv?group(prv,r=>r.who):new Map();
  let list=[...P.values()].map(p=>({...p,rate:p.vins?p.imp/p.vins:0,nd:p.days.size,avg:p.tasks/p.days.size,top:[...p.types].sort((x,y)=>y[1]-x[1])[0][0],prev:prevT.get(p.who)||0,dl:p.tasks-(prevT.get(p.who)||0)}));
  list.sort((x,y)=>{const A=x[sortKey],B=y[sortKey];return(typeof A=="string"?A.localeCompare(B):A-B)*sortDir});
  const mx=Math.max(1,...list.map(p=>p.tasks));
  const cols=[["who","Member"],["tasks","Tasks"],["vins","VINs"],["imp","Impacted"],["rate","Impact %"],["nd","Days active"],["avg","Tasks/day"],["dl","Δ tasks"],["top","Main work"]];
  document.getElementById("people").innerHTML="<thead><tr>"+cols.map(([k,l])=>`<th data-k="${k}">${l}${k==sortKey?(sortDir<0?" ↓":" ↑"):""}</th>`).join("")+"</tr></thead><tbody>"+
    list.map(p=>`<tr><td><b>${esc(p.who)}</b></td><td class="barcell"><span class="b" style="width:${p.tasks/mx*100}%"></span><span class="t">${p.tasks}</span></td><td>${fmt(p.vins)}</td><td>${fmt(p.imp)}</td><td>${pct(p.imp,p.vins)}</td><td>${p.nd}</td><td>${p.avg.toFixed(1)}</td><td class="${p.dl>0?"d up":p.dl<0?"d down":"d flat"}">${prv?(p.dl>0?"+":"")+p.dl:"–"}</td><td><span class="badge">${esc(p.top)}</span></td></tr>`).join("")+
    `<tr><td><b>Total</b></td><td><b>${a.tasks}</b></td><td><b>${fmt(a.vins)}</b></td><td><b>${fmt(a.imp)}</b></td><td><b>${pct(a.imp,a.vins)}</b></td><td></td><td></td><td>${b?(a.tasks-b.tasks>0?"+":"")+(a.tasks-b.tasks):"–"}</td><td></td></tr></tbody>`;
  document.querySelectorAll("#people th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortKey==k)sortDir*=-1;else{sortKey=k;sortDir=k=="who"||k=="top"?1:-1}render()});

  // days
  const dm=group(cur,r=>key(r.date));const dd=[];for(let i=0;i<7;i++){const x=new Date(s);x.setDate(x.getDate()+i);dd.push([x,dm.get(key(x))||0])}
  const dmx=Math.max(1,...dd.map(x=>x[1]));
  document.getElementById("days").innerHTML=dd.map(([x,v])=>`<div class="day"><div class="num">${v||""}</div><div class="col" style="height:${v/dmx*120}px;${v?"":"opacity:.25"}"></div><div>${x.toLocaleDateString("en-GB",{weekday:"short"})}<br>${x.getDate()}</div></div>`).join("");

  bars("types",group(cur,r=>r.type));
  bars("segs",group(cur,r=>r.seg));
  bars("ents",group(cur,r=>r.ent,r=>r.vins));

  // trend
  document.getElementById("trend").innerHTML="<thead><tr><th>Week starting</th><th>Tasks</th><th>VINs</th><th>Impacted</th><th>Impact %</th><th>Members</th><th>Top performer (tasks)</th></tr></thead><tbody>"+
    weeks.slice().reverse().map(w=>{const r=DATA.filter(x=>x.week==w),g=agg(r),t=[...group(r,x=>x.who)].sort((p,q)=>q[1]-p[1])[0];return `<tr${w==wk?' style="background:var(--bar)"':""}><td>${fmtD(new Date(w+"T00:00"))} ${w.slice(0,4)}</td><td>${g.tasks}</td><td>${fmt(g.vins)}</td><td>${fmt(g.imp)}</td><td>${pct(g.imp,g.vins)}</td><td>${g.people}</td><td>${esc(t[0])} (${t[1]})</td></tr>`}).join("")+"</tbody>";

  document.getElementById("csv").onclick=()=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"';const t=[HEAD.map(q).join(",")].concat(cur.map(r=>r.raw.map(q).join(","))).join("\n");const u=URL.createObjectURL(new Blob([t],{type:"text/csv"}));const l=document.createElement("a");l.href=u;l.download="team-performance-week-"+wk+".csv";l.click();URL.revokeObjectURL(u)};
}

async function fetchLive(){
  document.getElementById("src").textContent="Loading live data from Google Sheet…";
  try{const r=await fetch(CSV_URL+"&t="+Date.now());if(!r.ok)throw 0;const t=await r.text();if(!/date/i.test(t.slice(0,200)))throw 0;load(t,'Live from Google Sheet · updated '+new Date().toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"}))}
  catch(e){load(SNAPSHOT,'<span class="warn">Live sheet unreachable — showing snapshot from '+SNAPSHOT_DATE+'</span>')}
}
document.getElementById("wk").onchange=render;
document.getElementById("reload").onclick=fetchLive;
fetchLive();
</script>
